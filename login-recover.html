<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЛЯ · Вход</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f7f7f4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(460px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.ey{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#707070}h1{font-size:38px;line-height:1.05;margin:14px 0 10px}
p{color:#666;line-height:1.45}form{display:grid;gap:14px;margin-top:20px}label{display:grid;gap:7px;font-weight:650}
input{width:100%;font-size:17px;padding:15px;border:1px solid #cfcfc9;border-radius:15px;background:#fff}
button{border:0;border-radius:16px;padding:16px 18px;font-size:17px;font-weight:750;background:#0f4f3e;color:#fff}
button:disabled{opacity:.45}.status{margin-top:14px;padding:14px;border-radius:14px;background:#f1f1ed;color:#333}
.status.error{background:#f8e8e4;color:#8a352d}.status.ok{background:#e7f2ed;color:#174f3d}
.back{display:inline-block;margin-top:18px;color:#333;text-decoration:none}.small{font-size:13px;color:#888}
</style>
</head>
<body>
<main class="card">
<div class="ey">ЛЯ · аварийный вход</div>
<h1>Войти</h1>
<p>Используйте существующий аккаунт и новый пароль, который вы только что задали.</p>
<form id="login-form">
  <label>Email<input id="email" type="email" autocomplete="email" value="withlovepopova@yandex.ru" required></label>
  <label>Пароль<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
  <button id="submit" type="submit">Войти в ЛЯ</button>
</form>
<div id="status" class="status" hidden></div>
<p class="small">Новый аккаунт не создаётся. Эта страница только восстанавливает сессию существующего профиля.</p>
<a class="back" href="/">← Вернуться в ЛЯ</a>
</main>
<script>
(function(){
  const API='https://nmeoakrpafxhpdrplsuo.supabase.co/functions/v1/vmeste-api';
  const SESSION_KEY='vmeste_session_v1';
  const DEVICE_KEY='lya_pin_device_session_v1';
  const PIN_KEY='lya_pin_v1';
  const UNLOCK_KEY='lya_pin_unlocked_v1';

  function show(msg,kind){
    const el=document.getElementById('status');
    el.hidden=false;
    el.className='status'+(kind?' '+kind:'');
    el.textContent=msg;
  }

  document.getElementById('login-form').addEventListener('submit',async function(e){
    e.preventDefault();
    const btn=document.getElementById('submit');
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    btn.disabled=true;
    show('Вхожу…','');
    try{
      const r=await fetch(API,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'login',email:email,password:password})
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.session)throw new Error(d.error||'Не удалось войти');

      localStorage.setItem(SESSION_KEY,JSON.stringify(d.session));
      localStorage.removeItem(PIN_KEY);
      localStorage.removeItem(DEVICE_KEY);
      sessionStorage.removeItem(UNLOCK_KEY);

      show('Вход выполнен. Возвращаю в ЛЯ…','ok');
      setTimeout(()=>location.replace('/'),350);
    }catch(err){
      show((err&&err.message)||'Не удалось войти','error');
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
