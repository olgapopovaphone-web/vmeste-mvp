<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЛЯ · Новый пароль</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f7f7f4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(460px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.ey{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#707070}h1{font-size:38px;line-height:1.05;margin:14px 0 10px}
p{color:#666;line-height:1.45}form{display:grid;gap:14px;margin-top:20px}label{display:grid;gap:7px;font-weight:650}
input{width:100%;font-size:17px;padding:15px;border:1px solid #cfcfc9;border-radius:15px;background:#fff}
button{border:0;border-radius:16px;padding:16px 18px;font-size:17px;font-weight:750;background:#0f4f3e;color:#fff}
button:disabled{opacity:.45}.status{margin-top:14px;padding:14px;border-radius:14px;background:#f1f1ed;color:#333}
.status.error{background:#f8e8e4;color:#8a352d}.status.ok{background:#e7f2ed;color:#174f3d}
</style>
</head>
<body>
<main class="card">
<div class="ey">ЛЯ · восстановление доступа</div>
<h1>Новый пароль</h1>
<p id="intro">Придумайте новый пароль. После сохранения вы сразу вернётесь в ЛЯ.</p>
<form id="form">
  <label>Новый пароль<input id="password" type="password" autocomplete="new-password" minlength="6" required></label>
  <label>Повторите пароль<input id="password2" type="password" autocomplete="new-password" minlength="6" required></label>
  <button id="submit" type="submit">Сохранить пароль</button>
</form>
<div id="status" class="status" hidden></div>
</main>
<script>
(function(){
  const API='https://nmeoakrpafxhpdrplsuo.supabase.co/functions/v1/vmeste-api';
  const SESSION_KEY='vmeste_session_v1';
  const PIN_KEY='lya_pin_v1';
  const DEVICE_KEY='lya_pin_device_session_v1';
  const UNLOCK_KEY='lya_pin_unlocked_v1';
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const access=hash.get('access_token')||'';
  const refresh=hash.get('refresh_token')||'';
  const type=hash.get('type')||'';

  function show(msg,kind){const el=document.getElementById('status');el.hidden=false;el.className='status'+(kind?' '+kind:'');el.textContent=msg}
  async function call(action,payload,token){
    const r=await fetch(API,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:JSON.stringify(Object.assign({action},payload||{}))});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Ошибка запроса');
    return d;
  }
  if(!access||type!=='recovery'){
    document.getElementById('form').hidden=true;
    show('Ссылка восстановления недействительна или уже истекла. Запросите новую ссылку из ЛЯ.','error');
    return;
  }

  document.getElementById('form').addEventListener('submit',async function(e){
    e.preventDefault();
    const a=document.getElementById('password').value,b=document.getElementById('password2').value,btn=document.getElementById('submit');
    if(a.length<6){show('Пароль должен быть не короче 6 символов.','error');return}
    if(a!==b){show('Пароли не совпадают.','error');return}
    btn.disabled=true;show('Сохраняю новый пароль…','');
    try{
      await call('update_password',{password:a},access);
      const me=await call('me',{},access);
      const s={access_token:access,refresh_token:refresh,token_type:'bearer',user:me.user};
      localStorage.setItem(SESSION_KEY,JSON.stringify(s));
      localStorage.removeItem(PIN_KEY);
      localStorage.removeItem(DEVICE_KEY);
      sessionStorage.removeItem(UNLOCK_KEY);
      show('Готово. Возвращаю в ЛЯ…','ok');
      history.replaceState(null,'',location.pathname);
      setTimeout(()=>location.replace('/'),350);
    }catch(err){show(err.message||'Не удалось сохранить пароль.','error')}
    finally{btn.disabled=false}
  });
})();
</script>
</body>
</html>
